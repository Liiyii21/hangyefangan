<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行业智能体</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
﻿:root{--ink:#1B2A47;--gold:#C9A876;--beige:#F5EFE6;--pine:#2C5F5D;--bg:#FAF7F0;--paper:#FBF9F5;--line:rgba(27,42,71,.08);--line-dashed:rgba(27,42,71,.06);--nav-before:rgba(27,42,71,.15);--shadow-soft:rgba(27,42,71,.04);--shadow-med:rgba(27,42,71,.18);--gold-soft:rgba(201,168,118,.18);--gold-border:rgba(201,168,118,.4);--gold-nav-active:rgba(201,168,118,.15);--muted:#6A7388;--hero-dark:#0F1A30;--hero-mid:#1B2A47;--hero-light:#2C3F5E;--hero-angle:160deg;--callout-a:#FAF6EC;--callout-b:#F2EBDB;--phone-frame:#1B2A47;--phone-bg1:#FBF9F5;--phone-bg2:#F5EFE6;--user-msg-bg:#1B2A47;--pc-frame:#1B2A47;--pc-screen:#FBF9F5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","PingFang SC",sans-serif;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
#root{max-width:1280px;margin:0 auto;padding:64px 56px 96px}
.serif{font-family:"Noto Serif SC",serif}
.cormorant{font-family:"Cormorant Garamond",serif}

.hero{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(var(--hero-angle),var(--hero-dark) 0%,var(--hero-mid) 45%,var(--hero-light) 100%);color:#fff;padding:80px 72px 72px;margin-bottom:72px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 75% 30%,var(--gold-soft) 0%,transparent 50%);pointer-events:none}
.hero-tag{display:inline-block;font-family:"Cormorant Garamond",serif;font-size:14px;letter-spacing:.4em;color:var(--gold);text-transform:uppercase;margin-bottom:24px}
.hero-title{font-family:"Noto Serif SC",serif;font-size:64px;font-weight:500;line-height:1.15;margin-bottom:20px;letter-spacing:-.5px}
.hero-title em{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--gold);font-weight:400}
.hero-sub{font-size:18px;line-height:1.7;color:rgba(255,255,255,.78);max-width:720px;margin-bottom:56px}
.hero-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;border-top:1px solid rgba(255,255,255,.12);padding-top:36px}
.hero-meta-item small{font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.hero-meta-item p{font-size:15px;color:rgba(255,255,255,.85);margin-top:8px}

.step{margin-bottom:88px;padding-top:24px;border-top:1px solid var(--line)}
.step-num{display:flex;align-items:baseline;gap:16px;font-family:"Cormorant Garamond",serif;font-size:96px;font-weight:400;color:var(--ink);line-height:1;margin-bottom:8px}
.step-num small{font-family:"Cormorant Garamond",serif;font-size:14px;letter-spacing:.4em;color:var(--gold);text-transform:uppercase;font-weight:500}
.step-title{margin-bottom:48px}
.step-title h2{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:500;line-height:1.3;color:var(--ink);max-width:780px}
.step-title p{font-size:16px;color:var(--muted);max-width:720px;margin-top:16px;line-height:1.7}

.sec{font-family:"Noto Serif SC",serif;font-size:22px;font-weight:500;color:var(--ink);margin:48px 0 20px;padding-left:18px;border-left:3px solid var(--gold)}
.det{font-size:15px;color:var(--ink);line-height:1.85;margin-bottom:14px}
.det b{color:var(--ink);font-weight:600}
.bullet{font-size:14.5px;color:var(--ink);margin-bottom:8px;padding-left:24px;position:relative;line-height:1.7}
.bullet::before{content:"●";position:absolute;left:0;color:var(--gold);font-size:11px;top:6px}

.comp{background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px 36px;margin:28px 0 32px;box-shadow:0 1px 3px var(--shadow-soft)}
.comp h4{font-family:"Noto Serif SC",serif;font-size:17px;font-weight:600;color:var(--ink);margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.comp h4::before{content:"⚠";color:var(--gold);font-size:18px}
.comp .row{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px}
.comp .row:last-child{margin-bottom:0}
.comp .ic{flex:0 0 32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--ink),var(--hero-light));color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;font-family:"Cormorant Garamond",serif}
.comp .row > div:nth-child(2){flex:1;font-size:14.5px;line-height:1.75;color:var(--ink)}
.comp .row b{color:var(--ink);font-weight:600;display:inline-block;margin-right:8px}

.tech-stack{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:24px 0 32px}
.tech-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.tech-card h5{font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.tech-card p{font-size:13.5px;color:var(--ink);line-height:1.7}
.tech-card p b{color:var(--ink);font-weight:600}

.callout{background:linear-gradient(135deg,var(--callout-a) 0%,var(--callout-b) 100%);border:1px solid var(--gold-border);border-radius:14px;padding:24px 28px;margin:24px 0;font-size:14.5px;line-height:1.75;color:var(--ink)}
.callout b{color:var(--ink);font-weight:600}

.phones{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:32px 0 24px;padding:32px 0}
.ph{position:relative;width:100%;aspect-ratio:9/19.5;background:linear-gradient(180deg,var(--phone-bg1) 0%,var(--phone-bg2) 100%);border-radius:36px;border:8px solid var(--phone-frame);box-shadow:0 12px 40px var(--shadow-med),inset 0 0 0 1px rgba(255,255,255,.4);overflow:hidden;display:flex;flex-direction:column}
.ph .bar{display:flex;justify-content:space-between;align-items:center;padding:8px 18px 4px;font-size:11px;font-weight:600;color:var(--ink)}
.ph .bar .dots{display:flex;gap:3px}
.ph .bar .dots span{width:4px;height:4px;border-radius:50%;background:var(--ink)}
.ph .body{flex:1;padding:14px 16px;overflow:hidden;font-size:11px;line-height:1.55;color:var(--ink)}
.ph .nav{padding:6px 16px 12px;border-top:1px solid var(--line-dashed);display:flex;justify-content:space-around;font-size:9px;color:var(--muted)}
.ph .nav span{display:flex;flex-direction:column;align-items:center;gap:2px}
.ph .nav span::before{content:"";width:14px;height:14px;border-radius:3px;background:var(--nav-before)}
.ph .nav span.active{color:var(--gold)}
.ph .nav span.active::before{background:var(--gold)}
.ph-cap{font-size:11.5px;color:var(--muted);text-align:center;margin-top:14px;letter-spacing:.05em}
.ph-title{font-family:"Noto Serif SC",serif;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.ph-row{display:flex;justify-content:space-between;padding:5px 0;font-size:11px;color:var(--ink);border-bottom:1px dashed var(--line-dashed)}
.ph-row b{color:var(--ink);font-weight:600}
.ph-msg{padding:8px 10px;border-radius:10px;margin-bottom:8px;font-size:10.5px;line-height:1.55}
.ph-msg.user{background:var(--user-msg-bg);color:#fff;margin-left:24px;text-align:left}
.ph-msg.ai{background:#fff;border:1px solid var(--line);margin-right:24px}
.ph-msg.warn{background:var(--callout-a);border:1px solid var(--gold-border);color:var(--ink)}
.ph-pill{display:inline-block;padding:3px 10px;border-radius:20px;background:var(--gold);color:#fff;font-size:10px;font-weight:600;margin-bottom:8px}
.ph-score{text-align:center;padding:14px 0}
.ph-score .num{font-family:"Cormorant Garamond",serif;font-size:42px;color:var(--ink);font-weight:600}
.ph-score .lbl{font-size:10px;color:var(--muted);letter-spacing:.15em}
.ph-bar{display:flex;justify-content:space-between;margin:6px 0;font-size:10.5px;color:var(--ink)}
.ph-bar .fill{flex:1;height:4px;background:var(--line);margin:0 8px;border-radius:2px;align-self:center;position:relative;overflow:hidden}
.ph-bar .fill i{position:absolute;left:0;top:0;height:100%;background:var(--gold);border-radius:2px}

.pc{background:var(--pc-frame);border-radius:18px;padding:14px 14px 20px;margin:32px 0;box-shadow:0 16px 48px var(--shadow-med)}
.pc-screen{background:var(--pc-screen);border-radius:10px;overflow:hidden;display:flex;min-height:560px}
.pc-side{width:200px;background:var(--pc-frame);color:#fff;padding:24px 20px}
.pc-side .logo{font-family:"Noto Serif SC",serif;font-size:17px;font-weight:600;color:var(--gold);margin-bottom:32px}
.pc-side .nav-pc{display:flex;flex-direction:column;gap:14px}
.pc-side .nav-pc a{color:rgba(255,255,255,.7);font-size:13px;padding:8px 12px;border-radius:6px;cursor:pointer;display:block}
.pc-side .nav-pc a.active{background:var(--gold-nav-active);color:var(--gold)}
.pc-main{flex:1;padding:32px 36px;font-size:13px;color:var(--ink);line-height:1.7}
.pc-main h3{font-family:"Noto Serif SC",serif;font-size:20px;font-weight:600;margin-bottom:20px;color:var(--ink)}
.pc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:14px 0}
.pc-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px}
.pc-card h6{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.2em;margin-bottom:8px}
.pc-card .big{font-family:"Cormorant Garamond",serif;font-size:30px;color:var(--ink);font-weight:600}

.trust{margin-top:96px;padding-top:48px;border-top:1px solid var(--line);display:grid;grid-template-columns:2fr 1fr 1fr;gap:48px;font-size:13px;color:var(--muted);line-height:1.8}
.trust h6{font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:.3em;color:var(--ink);text-transform:uppercase;margin-bottom:14px}
.trust p b{color:var(--ink);font-weight:600}


</style></head><body><div id="root">
<header class="hero">
  <div class="hero-content">
    <h1 class="brand-name-en">YouMemorial</h1>
    <h1 class="brand-name-zh">由你忆念</h1>
    <p class="tagline">每一段陪伴，都值得温柔告别</p>
    <button class="cta-button">了解服务</button>
  </div>
  <div class="hero-overlay"></div>
</header>

<section class="services">
  <h2>我们的服务</h2>
  <div class="service-grid">
    <div class="service-card">
      <div class="service-icon">🐾</div>
      <h3>个体火化</h3>
      <p>全程一对一，专属告别仪式</p>
    </div>
    <div class="service-card">
      <div class="service-icon">🌿</div>

    </div>
    <div class="service-card">
      <div class="service-icon">💧</div>
      <h3>家庭告别</h3>
      <p>上门接运，居家告别方案</p>
    </div>
  </div>
</section>

<section class="philosophy">
  <div class="philosophy-text">
    <h2>由你开始，温柔告别</h2>
    <p>我们相信，每一个生命都值得被尊重。<br>YouMemorial 提供专业、温暖的宠物身后服务，让告别不再仓促，而是一场有温度的纪念。</p>
  </div>
</section>

<footer class="contact">
  <div class="contact-info">
    <p>📞 24小时守护专线：400 881 7759</p>
    <p>📍 全国主要城市均设纪念中心</p>
    <p>❤️ 由你忆念 · 让爱永续</p>
  </div>
</footer>
